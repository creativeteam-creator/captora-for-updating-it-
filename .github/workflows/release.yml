# Builds Captora installers on every git tag matching v*.
#
# Triggers on tag push:    git tag v1.0.1 && git push --tags
# Outputs to GitHub Releases (which electron-updater polls):
#   - Captora-Setup-X.Y.Z.exe        (Windows NSIS)
#   - Captora-X.Y.Z-arm64.dmg        (Apple Silicon)
#   - Captora-X.Y.Z-x64.dmg          (Intel Mac)
#   - latest.yml + latest-mac.yml    (update manifests)
#
# Free tier covers ~200 releases/month for private repos, unlimited for
# public. Mac builds run on macos-latest (arm64); Windows on
# windows-latest (x64). No paid signing certs required for the free
# ad-hoc Mac path; if you ever buy an Apple Developer cert, drop the
# CSC_LINK + APPLE_ID secrets into the repo and they'll be picked up
# automatically by electron-builder.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root + workspace deps
        run: npm ci --workspaces --include-workspace-root

      - name: Build (Next.js standalone + Electron + installer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple signing — only used when these are set in repo secrets.
          # Without them, Mac builds use ad-hoc signing (free path).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:${{ matrix.target }} -- --publish always
