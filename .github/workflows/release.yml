# Builds Captora installers on every git tag matching v*.
#
# Triggers on tag push:    git tag v1.0.1 && git push --tags
# Outputs to GitHub Releases (which electron-updater polls):
#   - Captora-Setup-X.Y.Z.exe        (Windows NSIS, x64)
#   - Captora-X.Y.Z-arm64.dmg        (Apple Silicon)
#   - Captora-X.Y.Z-x64.dmg          (Intel Mac)
#   - Captora-X.Y.Z.AppImage         (Linux x64, portable + auto-updatable)
#   - captora_X.Y.Z_amd64.deb        (Debian / Ubuntu)
#   - latest.yml / latest-mac.yml / latest-linux.yml  (update manifests)
#
# No Windows ARM64 target, deliberately: Remotion 4.0.x publishes no
# `@remotion/compositor-win32-arm64`, so a native ARM64 build would
# install fine and then fail at export. Windows 11 on ARM runs the x64
# build (and its x64 compositor) under emulation, so those users are
# already covered by the same installer.
#
# ── Code signing ────────────────────────────────────────────────────────
# All three platforms build unsigned by default. electron-builder.config.js
# turns real signing + notarization on BY ITSELF as soon as the relevant
# secrets exist — the env block in the build step below is already wired,
# so the only action needed is adding the secrets:
#
#   macOS:    CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
#             APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows:  WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD  (traditional .pfx)
#             — or — AZURE_TRUSTED_SIGNING_* + AZURE_CLIENT_* (cheaper)
#
# Adding them also flips `captoraSigned: true` inside the packaged app,
# which makes electron/src/autoUpdate.ts stop bypassing signature
# verification and switch Mac to the seamless Squirrel.Mac update flow.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root + workspace deps
        # `npm install` (not `npm ci`) on first builds — npm workspaces
        # plus a fresh lockfile sometimes trip ci's strict checks. install
        # is more forgiving and still uses the lockfile when it matches.
        run: npm install --workspaces --include-workspace-root --no-audit --no-fund

      - name: Install cross-arch Remotion compositor for Mac DMG
        # The macOS runner is arm64. `npm install` only installs the
        # arm64 compositor by default and refuses x64 with EBADPLATFORM
        # (its package.json declares cpu: x64). `--force` bypasses the
        # platform check; we're not RUNNING the binary on this host,
        # we just need it on disk so electron-builder can bundle it
        # into the x64 DMG. Otherwise the x64 DMG ships without a
        # working /remotion executable and Mac Intel users get ENOENT
        # on export.
        if: runner.os == 'macOS'
        run: npm install @remotion/compositor-darwin-x64 --no-save --no-audit --no-fund --force

      - name: Install Linux packaging dependencies
        # Only what electron-builder needs to ASSEMBLE the artifacts:
        #   fakeroot        — building the .deb without root
        #   libarchive-tools — bsdtar, used for the AppImage payload
        #
        # Chromium's runtime libraries (libgbm, libnss3, libasound…) are
        # deliberately NOT installed. The CI job packages the app, it
        # never launches it, so they'd prove nothing here — and the
        # libasound package was renamed to libasound2t64 in Ubuntu 24.04,
        # which would silently break this job the next time GitHub moves
        # `ubuntu-latest`. Those libraries belong on the END USER's
        # machine, where the .deb declares them via electron-builder's
        # default Electron dependency set.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot libarchive-tools

      - name: Verify Linux Remotion compositor is present
        # The Linux compositor is an optionalDependency of
        # @remotion/renderer resolved by platform. If npm skipped it, the
        # build would still succeed and then fail at the user's first
        # export with a missing-binary error — the exact class of bug the
        # Mac x64 step above exists to prevent. Fail loudly here instead.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -d node_modules/@remotion/compositor-linux-x64-gnu ]; then
            echo "::error::@remotion/compositor-linux-x64-gnu is missing — the Linux build would ship without a working renderer."
            ls node_modules/@remotion || true
            exit 1
          fi
          echo "Linux compositor present:"
          ls node_modules/@remotion/compositor-linux-x64-gnu

      - name: Validate required secrets
        # Fails the build EARLY if any required secret is missing or
        # empty. Without this, the build proceeds with empty NEXT_PUBLIC_*
        # vars, and the client bundle ends up calling Supabase with
        # `undefined` URL — the error only surfaces in the user's
        # browser at runtime ("Your project's URL and API key are
        # required"). Loud failure here saves hours of debugging.
        shell: bash
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          PROD_GROQ_API_KEY: ${{ secrets.PROD_GROQ_API_KEY }}
        run: |
          missing=()
          [ -z "$PROD_SUPABASE_URL" ] && missing+=("PROD_SUPABASE_URL")
          [ -z "$PROD_SUPABASE_ANON_KEY" ] && missing+=("PROD_SUPABASE_ANON_KEY")
          [ -z "$PROD_SUPABASE_SERVICE_ROLE_KEY" ] && missing+=("PROD_SUPABASE_SERVICE_ROLE_KEY")
          [ -z "$PROD_GROQ_API_KEY" ] && missing+=("PROD_GROQ_API_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty secret(s): ${missing[*]}"
            echo "Add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          # Print lengths (not values) so we can confirm secrets ARE
          # populated without leaking them into the public log.
          echo "Secret lengths (chars):"
          echo "  PROD_SUPABASE_URL              = ${#PROD_SUPABASE_URL}"
          echo "  PROD_SUPABASE_ANON_KEY         = ${#PROD_SUPABASE_ANON_KEY}"
          echo "  PROD_SUPABASE_SERVICE_ROLE_KEY = ${#PROD_SUPABASE_SERVICE_ROLE_KEY}"
          echo "  PROD_GROQ_API_KEY              = ${#PROD_GROQ_API_KEY}"

      - name: Generate production env from GitHub Secrets
        # Writes web/.env.production using values stored as GitHub repo
        # secrets (Settings → Secrets and variables → Actions). The file
        # is consumed twice:
        #   1. At build time — Next.js inlines NEXT_PUBLIC_* into the
        #      static bundle.
        #   2. At runtime — the Electron main process reads it and passes
        #      the server-side keys into the spawned Next.js server.
        # Secrets never appear in repo history; they live only inside
        # the encrypted GitHub Actions vault.
        shell: bash
        run: |
          cat > web/.env.production <<EOF
          # Generated by .github/workflows/release.yml — do not commit
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}

          # ── Cloud STT (primary): ElevenLabs Scribe ──────────────────
          ELEVENLABS_API_KEY=${{ secrets.PROD_ELEVENLABS_API_KEY }}

          # ── Cloud STT fallback + LLM polish: Groq ────────────────────
          GROQ_API_KEY=${{ secrets.PROD_GROQ_API_KEY }}

          # ── LLM polish fallback: Gemini Flash (free) ─────────────────
          GEMINI_API_KEY=${{ secrets.PROD_GEMINI_API_KEY }}

          # ── Hinglish LLM provider preference ─────────────────────────
          # Default chain order in code is Anthropic > OpenAI > Gemini >
          # Groq. We don't pin a provider here so production lets Gemini
          # Flash run first (fast, free, large daily request budget) and
          # falls through to Groq Llama-3.3-70b automatically on Gemini
          # quota / 5xx / timeout. The phonetic safety net + expanded
          # prompt examples make either provider produce equivalent
          # captions in practice.

          # ── Local GPU transcription (Python + faster-whisper) ────────
          # Capability detection at first launch flips this to 0 on
          # machines without Python/faster-whisper installed.
          FASTER_WHISPER_ENABLED=1
          FASTER_WHISPER_MODEL=large-v3
          FASTER_WHISPER_COMPUTE_TYPE=float16
          FASTER_WHISPER_INITIAL_PROMPT=${{ secrets.PROD_INITIAL_PROMPT }}
          CAPTORA_TRANSCRIPT_GLOSSARY=${{ secrets.PROD_TRANSCRIPT_GLOSSARY }}

          # Optional providers (leave empty unless used)
          SARVAM_API_KEY=${{ secrets.PROD_SARVAM_API_KEY }}
          SHUNYA_HINGLISH_ENABLED=0
          EOF
          echo "Wrote web/.env.production ($(wc -l < web/.env.production) lines)"

      - name: Build Next.js standalone (web)
        # Split out from the `release` script so the compositor pre-stage
        # below can run AFTER the standalone tree exists but BEFORE
        # electron-builder packs.
        run: npm run build:web

      - name: Pre-stage Remotion runtime + compositor binaries into standalone
        # Next.js's standalone tracer follows static imports but misses:
        #   - native compositor binaries (`remotion`, `ffmpeg`, `ffprobe`)
        #     because they aren't `require()`'d as JS
        #   - `@remotion/bundler` and its esbuild deps because /api/render
        #     loads them dynamically at runtime via `import("@remotion/bundler")`,
        #     and Next.js skips dynamic imports when tracing.
        #
        # We resolve both by copying every @remotion/* folder from
        # node_modules into the standalone tree with `cp -Rn`
        # (no-clobber) — files Next.js already placed stay put, missing
        # ones get filled in. Cheap (~50 MB), deterministic, and works
        # the same on Mac + Windows runners.
        shell: bash
        run: |
          set -e
          STANDALONE_NM=web/.next/standalone/node_modules
          mkdir -p "$STANDALONE_NM/@remotion"

          # 1. The bare `remotion` package — exposes `remotion/no-react`
          # which @remotion/studio-shared requires at runtime. Next.js
          # missed it because the entry is loaded via deep-import string.
          if [ -d node_modules/remotion ]; then
            echo "Staging remotion (core)"
            mkdir -p "$STANDALONE_NM/remotion"
            cp -Rn node_modules/remotion/. "$STANDALONE_NM/remotion"/ 2>/dev/null || \
              cp -R node_modules/remotion/. "$STANDALONE_NM/remotion"/
          fi

          # 2. @remotion/* packages — compositor binaries + bundler + renderer
          if [ -d node_modules/@remotion ]; then
            for pkg in node_modules/@remotion/*/; do
              name=$(basename "$pkg")
              dst="$STANDALONE_NM/@remotion/$name"
              echo "Staging @remotion/$name → $dst"
              mkdir -p "$dst"
              cp -Rn "$pkg"/. "$dst"/ 2>/dev/null || cp -R "$pkg"/. "$dst"/
            done
          fi

          # 2. esbuild — required by @remotion/bundler at runtime
          if [ -d node_modules/esbuild ]; then
            echo "Staging esbuild"
            mkdir -p "$STANDALONE_NM/esbuild"
            cp -Rn node_modules/esbuild/. "$STANDALONE_NM/esbuild"/ 2>/dev/null || \
              cp -R node_modules/esbuild/. "$STANDALONE_NM/esbuild"/
          fi
          # esbuild ships platform-native binaries via @esbuild/<platform>-<arch>
          if [ -d node_modules/@esbuild ]; then
            mkdir -p "$STANDALONE_NM/@esbuild"
            for pkg in node_modules/@esbuild/*/; do
              name=$(basename "$pkg")
              dst="$STANDALONE_NM/@esbuild/$name"
              echo "Staging @esbuild/$name"
              mkdir -p "$dst"
              cp -Rn "$pkg"/. "$dst"/ 2>/dev/null || cp -R "$pkg"/. "$dst"/
            done
          fi

          # 4. execa + its full dependency tree — @remotion/renderer imports
          # execa via deep ESM import which Next.js's tracer often misses.
          # 5. ffmpeg-static — ships a platform-native ffmpeg binary that
          # the trace skips (it's not JS). Used by audio-extract.ts to
          # pull MP3 audio from video before cloud STT, and by whisper.ts
          # for local CPU Whisper's audio decoding.
          # Belt-and-suspenders: stage all transitives we've seen at runtime.
          for pkg in execa cross-spawn which path-key get-stream human-signals \
                      is-stream merge-stream npm-run-path mimic-fn onetime \
                      signal-exit strip-final-newline shebang-command \
                      shebang-regex isexe \
                      ffmpeg-static \
                      extract-zip yauzl buffer-crc32 fd-slicer pend debug ms \
                      pump end-of-stream once wrappy inherits mkdirp \
                      react react-dom scheduler; do
            SRC="node_modules/$pkg"
            DST="$STANDALONE_NM/$pkg"
            if [ -d "$SRC" ]; then
              echo "Staging $pkg"
              mkdir -p "$DST"
              cp -Rn "$SRC"/. "$DST"/ 2>/dev/null || cp -R "$SRC"/. "$DST"/
              # ffmpeg-static needs its binary executable on Mac/Linux
              if [ "$pkg" = "ffmpeg-static" ] && [ "$RUNNER_OS" != "Windows" ]; then
                find "$DST" -type f -name 'ffmpeg' -exec chmod +x {} \; 2>/dev/null || true
              fi
            fi
          done

          # 6. The Remotion composition workspace (sibling to web/).
          # /api/render's bundle() reads `remotion/src/index.ts` relative
          # to process.cwd() — i.e. the standalone root's sibling. That
          # folder doesn't exist until we copy it: the standalone tree
          # only contains the web workspace by default. Without this
          # render fails on first invocation with:
          #   ENOENT: ...standalone/remotion/src/index.ts
          # The bundle() call runs esbuild on raw TSX, so we need the
          # entire src/ directory (plus package.json + tsconfig for
          # esbuild resolution).
          STANDALONE_ROOT=web/.next/standalone
          if [ -d remotion ]; then
            echo "Staging remotion workspace → $STANDALONE_ROOT/remotion"
            mkdir -p "$STANDALONE_ROOT/remotion"
            for sub in src public package.json tsconfig.json remotion.config.ts; do
              if [ -e "remotion/$sub" ]; then
                cp -Rn "remotion/$sub" "$STANDALONE_ROOT/remotion/" 2>/dev/null || \
                  cp -R "remotion/$sub" "$STANDALONE_ROOT/remotion/"
              fi
            done
          fi

          # 7. Auto-discover & stage every transitive dep Remotion's
          # bundler/renderer needs at runtime. Replaces the historical
          # whack-a-mole of adding one missing package per release
          # (extract-zip → pump → style-loader → …). Scans require() /
          # import() strings + manifest dependencies recursively from
          # @remotion/bundler + @remotion/renderer + remotion seeds.
          echo ""
          echo "Running auto-stager (Remotion deep deps)..."
          node scripts/stage-remotion-deps.js || echo "  (auto-stager failed — manual list above still covers known deps)"

          echo ""
          echo "@remotion contents in standalone:"
          ls "$STANDALONE_NM/@remotion" 2>/dev/null || echo "  (empty)"
          echo ""
          echo "execa in standalone:"
          ls "$STANDALONE_NM/execa" 2>/dev/null | head -5 || echo "  (missing)"
          echo ""
          echo "style-loader in standalone (auto-stager check):"
          ls "$STANDALONE_NM/style-loader" 2>/dev/null | head -3 || echo "  (missing — auto-stager regression!)"
          echo ""
          echo "remotion workspace src in standalone:"
          ls "$STANDALONE_ROOT/remotion/src" 2>/dev/null | head -10 || echo "  (missing)"

      - name: Build Electron + installer + publish
        env:
          # `GH_TOKEN` is what electron-builder's GitHub publisher reads.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── Apple signing + notarization (all optional) ──────────────
          # Every one of these is empty until the certs are bought.
          # electron-builder.config.js checks for them and keeps the
          # ad-hoc unsigned path when they're absent — nothing here
          # fails on a missing secret.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # electron-builder's notarytool integration reads exactly this
          # variable name. The older APPLE_ID_PASSWORD is passed too so a
          # secret already stored under that name keeps working.
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_ID_PASSWORD }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # ── Windows signing, option (a): traditional .pfx ────────────
          # Kept separate from CSC_LINK so a Mac cert can never be picked
          # up by the Windows job (and vice versa).
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # ── Windows signing, option (b): Azure Trusted Signing ───────
          # Cheapest route to a trusted Authenticode signature (~$10/mo,
          # no EV hardware token). Set all six to enable.
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        # Compile electron's TS, then run electron-builder with explicit
        # `--publish always` so the GitHub publisher uploads the assets.
        # We skipped `npm run release` because that re-runs build:web
        # AFTER our pre-stage step, which would wipe the staged files.
        #
        # `--config` is explicit rather than relying on auto-discovery, so
        # a stray electron-builder.yml appearing later can't silently take
        # over the release build.
        run: |
          npm run build:electron
          npx electron-builder --publish always --config electron-builder.config.js
